name: 问题反馈
description: C99 preset、组件或函数手册问题
body:
  - type: input
    id: version
    attributes:
      label: Preset 版本
      placeholder: 例如 0.6.6
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 系统、IDE、编译器及 Companion 版本。
      placeholder: 例如 Windows 11、Dev-C++、GCC 9.x
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与实际结果
      description: 附编译命令、完整报错或最小示例。手册问题请注明段落。请勿上传个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
