name: Check, build and release

on:
  push:
    branches: [main, 'feat/handbook-topic-templates']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Check and test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 tools/build.py --check
          python3 tests/test_project.py
          mkdir -p build
          source="$(python3 tools/build.py --source-name)"
          cc -std=c99 -O2 -Wall -Wextra -Werror "dist/$source" -o build/c_scaffold
          ./build/c_scaffold --version
      - name: Check and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: |
          python3 tools/build.py --check
          python3 tests/test_project.py
          mkdir -p build
          source="$(python3 tools/build.py --source-name)"
          gcc -std=c99 -O2 -Wall -Wextra -Werror "dist/$source" -o build/c_scaffold.exe -luser32
          ./build/c_scaffold.exe --version

  gcc9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ASCII source with GCC 9 and legacy character sets
        shell: bash
        run: |
          source="$(python3 tools/build.py --source-name)"
          mkdir -p build
          docker run --rm -v "$PWD:/project" -w /project -e SCAFFOLD_SOURCE="$source" gcc:9 bash -c '
            set -eu
            for charset in UTF-8 GBK; do
              gcc -std=c99 -Wall -Wextra -Werror -finput-charset="$charset" -fexec-charset="$charset" "dist/$SCAFFOLD_SOURCE" -o /tmp/c_scaffold
              /tmp/c_scaffold --version > "build/gcc9-$charset.txt"
            done
            cmp build/gcc9-UTF-8.txt build/gcc9-GBK.txt
          '
          python3 -c "from pathlib import Path; assert 'C语言脚手架' in Path('build/gcc9-GBK.txt').read_text(encoding='utf-8')"

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk fonts-dejavu-core poppler-utils
          python3 -m pip install -r tools/pdf-requirements.txt
      - name: Build source package and PDF
        shell: bash
        run: |
          python3 tools/build.py --check
          python3 tools/build_pdf.py
          python3 tests/test_pdf.py
          python3 tools/build.py --package
          mkdir assets
          version="$(python3 -c "import json; print(json.load(open('catalog/catalog.json'))['version'])")"
          handbook="$(python3 -c "import json; print(json.load(open('catalog/catalog.json'))['handbook_version'])")"
          source="$(python3 tools/build.py --source-name)"
          cp "dist/$source" assets/
          cp release/*.zip assets/
          cp release/*.pdf assets/
          cp release/*.md assets/
          pdftotext "release/c-exam-handbook-v$handbook.pdf" build-pdf-text.txt
          grep -q '脚手架' build-pdf-text.txt
          grep -q '四舍五入' build-pdf-text.txt
          grep -q '指定字符' build-pdf-text.txt
          test -z "$(find assets -type f \( -name '*.exe' -o -name '*.tar.gz' \))"
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-documents
          path: assets/*

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, gcc9, documents]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-and-documents
          path: artifacts
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 -c "import json; print(json.load(open('catalog/catalog.json'))['version'])")"
          python3 tools/release_notes.py > release-notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$(gh release view "v$version" --json isDraft --jq .isDraft)" = false ]; then
              echo "Published release v$version already exists; bump version to publish another."
              exit 0
            fi
          else
            gh release create "v$version" --draft --target "$GITHUB_SHA" --title "C语言考试工具包 · 脚手架 v$version" --notes-file release-notes.md
          fi
          mkdir assets
          find artifacts -type f -exec cp {} assets/ \;
          for file in assets/*; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "v$version" "$file" --clobber; then
                uploaded=true
                break
              fi
              sleep 2
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $file; leaving release as a draft."
              exit 1
            fi
          done
          gh release edit "v$version" --draft=false
