name: Lightweight C99 preset tests

on:
  push:
    branches: ['feat/lightweight-io-standalone-preset', 'feat/lightweight-algorithms-phase1']
  pull_request:
    branches: [main]
    paths:
      - 'scaffold/presets/exam-io-c99/**'
      - 'tests/test_lightweight_io.py'
      - 'tests/test_lightweight_algorithms.py'
      - '.github/workflows/lightweight-io.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_lightweight_io.py
      - run: python3 tests/test_lightweight_algorithms.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_lightweight_io.py
      - run: python3 tests/test_lightweight_algorithms.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Test IO preset (GCC)
        shell: msys2 {0}
        run: python3 tests/test_lightweight_io.py
      - name: Test algorithms (GCC)
        shell: msys2 {0}
        run: python3 tests/test_lightweight_algorithms.py
  standalone-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exam-kit
      - uses: actions/checkout@v4
        with:
          repository: Annouimo/better-accoding-for-buaaers
          ref: feat/standalone-cli-foundation
          path: accoding
      - uses: oven-sh/setup-bun@v2
      - name: Initialize, assemble, compile and run using upstream CLI
        shell: bash
        run: |
          set -euo pipefail
          cd accoding
          bun src/standalone/cli.ts scaffold init ../sample-problem \
            --preset ../exam-kit/scaffold/presets/exam-io-c99/manifest.json
          cat > ../sample-problem/main.c <<'EOF'
          #include "exam.h"
          int main(void) {
              int n = read_int(), a[100];
              read_ints(a, n);
              sort_ints(a, n);
              print_ints(a, n, " ", "\n");
              return 0;
          }
          EOF
          bun src/standalone/cli.ts scaffold prepare ../sample-problem/main.c --cc gcc
          test -s ../sample-problem/.accoding/submit.c
          if grep -q 'EXAM_BIGINT_CAP' ../sample-problem/.accoding/submit.c; then
            echo 'Unexpected BigInt in submitted source' >&2
            exit 1
          fi
          grep -q 'static inline void sort_ints' ../sample-problem/.accoding/submit.c
          gcc -std=c99 -O2 ../sample-problem/.accoding/submit.c -o ../sample-problem/program -lm
          result="$(printf '4 8 2 4 1\n' | ../sample-problem/program)"
          test "$result" = "1 2 4 8"
