name: C Toolbox prototype
on:
  push:
    branches: [main, feat/c-toolbox-prototype]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  pull_request:
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, sanitize: '', python: '3.12'}
          - {os: ubuntu-24.04, cc: clang, sanitize: '-fsanitize=address,undefined -fno-omit-frame-pointer -g', python: '3.12'}
          - {os: macos-15, cc: clang, sanitize: '', python: '3.12'}
          - {os: windows-2022, cc: gcc, sanitize: '', python: '3.12'}
          - {os: ubuntu-22.04, cc: gcc, sanitize: '', python: '3.9'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure MinGW path
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Test standalone generation and C behavior
        env:
          CC: ${{ matrix.cc }}
          TOOLBOX_CFLAGS: ${{ matrix.sanitize }}
          ASAN_OPTIONS: detect_leaks=1
        run: python toolbox/tests/test_toolbox.py
      - name: Verify package reproducibility
        run: python toolbox/build.py --check
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python toolbox/build.py
      - name: Generate preview sources
        run: |
          python toolbox/dist/c_toolbox_v0.4.0.py --modules string vector map set counter deque heap io -o toolbox/dist/c_toolbox_all_v0.4.0.h
          python toolbox/dist/c_toolbox_v0.4.0.py --modules string counter --main toolbox/examples/word_count.c -o toolbox/dist/word_count.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules vector --vector StudentVector=Student --preamble toolbox/examples/student_types.c --main toolbox/examples/student_sort.c -o toolbox/dist/student_sort.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules string --main toolbox/examples/remove_words.c -o toolbox/dist/remove_words.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules heap --main toolbox/examples/priority_queue.c -o toolbox/dist/priority_queue.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules io --main toolbox/examples/io_lines.c -o toolbox/dist/io_lines.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules io --main toolbox/examples/io_remove_words.c -o toolbox/dist/io_remove_words.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules io counter --main toolbox/examples/word_report.c -o toolbox/dist/word_report.c
          python toolbox/dist/c_toolbox_v0.4.0.py --modules io --main toolbox/examples/number_report.c -o toolbox/dist/number_report.c
      - uses: actions/upload-artifact@v4
        with:
          name: c-toolbox-v0.4.0-preview
          path: |
            toolbox/dist/
            toolbox/README.md
            toolbox/docs/
            LICENSING.md
            LICENSE
            LICENSES/MIT-0.txt
            LICENSES/CC-BY-4.0.txt
          if-no-files-found: error

