name: C Toolbox prototype
on:
  push:
    branches: [main, feat/c-toolbox-prototype]
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  pull_request:
    paths: ['toolbox/**', '.github/workflows/toolbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, sanitize: ''}
          - {os: ubuntu-latest, cc: clang, sanitize: '-fsanitize=address,undefined -fno-omit-frame-pointer -g'}
          - {os: macos-latest, cc: clang, sanitize: ''}
          - {os: windows-latest, cc: gcc, sanitize: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Configure MinGW path
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Test standalone generation and C behavior
        env:
          CC: ${{ matrix.cc }}
          TOOLBOX_CFLAGS: ${{ matrix.sanitize }}
          ASAN_OPTIONS: detect_leaks=1
        run: python toolbox/tests/test_toolbox.py
      - name: Verify package reproducibility
        run: python toolbox/build.py --check
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python toolbox/build.py
      - name: Generate preview sources
        run: |
          python toolbox/dist/c_toolbox_v0.1.0.py --modules string vector map set counter -o toolbox/dist/c_toolbox_all_v0.1.0.h
          python toolbox/dist/c_toolbox_v0.1.0.py --modules string counter --main toolbox/examples/word_count.c -o toolbox/dist/word_count.c
          python toolbox/dist/c_toolbox_v0.1.0.py --modules vector --vector StudentVector=Student --preamble toolbox/examples/student_types.c --main toolbox/examples/student_sort.c -o toolbox/dist/student_sort.c
      - uses: actions/upload-artifact@v4
        with:
          name: c-toolbox-v0.1.0-preview
          path: |
            toolbox/dist/
            toolbox/README.md
            LICENSE
            LICENSES/MIT-0.txt
            LICENSES/CC-BY-4.0.txt
          if-no-files-found: error
