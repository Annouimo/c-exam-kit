name: Publish npm release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publish-npm.yml', '.github/scripts/npm-release-state*.mjs']
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'kit.json', 'GUIDE.md', 'package.json', 'tests/**', '.github/workflows/publish-npm.yml', '.github/scripts/npm-release-state*.mjs']
  workflow_dispatch:
    inputs:
      mode:
        description: "AUTO publishes new declared version; DRY_RUN builds only; PUBLISH retries"
        type: choice
        required: true
        default: AUTO
        options: [AUTO, DRY_RUN, PUBLISH]
      expected_version:
        description: "Optional assertion of declared package.json version"
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.select.outputs.version }}
      mode: ${{ steps.select.outputs.mode }}
      tag: ${{ steps.select.outputs.tag }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/npm-release-state.test.mjs
      - name: Select declared version
        id: select
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc|dev)\.(0|[1-9][0-9]*)$'
          if [[ "$version" =~ $stable ]]; then tag=latest; elif [[ "$version" =~ $preview ]]; then tag=next; else exit 1; fi
          [[ -z "$EXPECTED_VERSION" || "$EXPECTED_VERSION" == "$version" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request) mode=DRY_RUN ;;
            push) mode=PUBLISH ;;
            workflow_dispatch) mode="$REQUESTED_MODE" ;;
            *) exit 1 ;;
          esac
          [[ "$mode" != AUTO ]] || mode=PUBLISH
          case "$mode" in DRY_RUN) ;; PUBLISH) test "$GITHUB_REF" = refs/heads/main ;; *) exit 1 ;; esac
          printf 'version=%s\nmode=%s\ntag=%s\n' "$version" "$mode" "$tag" >> "$GITHUB_OUTPUT"
      - name: Check registry without publish permissions
        id: registry
        env:
          MODE: ${{ steps.select.outputs.mode }}
          VERSION: ${{ steps.select.outputs.version }}
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          if [[ "$MODE" == DRY_RUN ]]; then echo publish=false >> "$GITHUB_OUTPUT"; else node .github/scripts/npm-release-state.mjs @routilet/c-exam-kit "$VERSION" "$TAG"; fi

  pack:
    needs: plan
    if: needs.plan.outputs.mode == 'DRY_RUN' || needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify source and test C99
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg=require("./package.json");
          if(pkg.name!=="@routilet/c-exam-kit" || pkg.repository?.url!=="git+https://github.com/Routilet/c-exam-kit.git" || pkg.version!==process.env.EXPECTED_VERSION || !pkg.private) throw Error("Invalid source package");
          NODE
          python3 tests/test_lightweight_io.py
          python3 tests/test_lightweight_algorithms.py
      - name: Validate and pack data-only resources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-dist"
          node scripts/build.mjs
          npm pack ./dist/package --pack-destination "$RUNNER_TEMP/npm-dist"
          cd dist/package
          test -f LICENSE
          test -f preset/CC-BY-4.0.txt
          test ! -e preset/components
          test ! -e preset/manual.zh-CN.md
          node - <<'NODE'
          const fs=require("node:fs"),pkg=require("./package.json");
          const r=JSON.parse(fs.readFileSync("preset/reference.json","utf8"));
          if(r.schemaVersion!==2 || r.version!==pkg.version || !r.entries?.length || !r.tags?.length || "categories" in r || "sections" in r) throw Error("Invalid flat reference");
          const m=JSON.parse(fs.readFileSync("preset/manifest.json","utf8"));
          if(m.schemaVersion!==2 || m.languageId!=="c99" || m.language!=="c" || m.standard!=="c99" || !m.components?.length) throw Error("Invalid manifest");
          for(const c of m.components) if(typeof c.code!=="string" || !c.code.trim() || "source" in c) throw Error("Invalid component "+c.id);
          console.log("Validated",m.components.length,"components",r.entries.length,"manual entries");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarball
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, pack]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@^11.21.0"
      - name: Recheck registry
        id: registry
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: node .github/scripts/npm-release-state.mjs @routilet/c-exam-kit "$VERSION" "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: release
      - name: Publish selected npm tag via OIDC
        if: steps.registry.outputs.publish == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          tarball="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm publish "$(realpath "$tarball")" --tag "$TAG" --access public
