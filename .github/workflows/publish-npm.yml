    needs: [plan, pack]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure OIDC compatible npm CLI
        run: npm install --global "npm@^11.21.0"
      - name: Recheck registry before publishing
        id: registry
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/npm-release-state.mjs @routilet/c-exam-kit "$VERSION"
