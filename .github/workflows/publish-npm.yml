      - name: Ensure OIDC compatible npm CLI
        run: npm install --global "npm@^11.21.0"
      - name: Recheck registry before publishing
        id: registry
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/npm-release-state.mjs @routilet/c-exam-kit "$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: ./release
      - name: Publish stable package with npm OIDC
        if: steps.registry.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tarball="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          # npm must receive an explicit filesystem path, not a package/Git spec.
          npm publish "$(realpath "$tarball")" --tag latest --access public

          if [[ "$version" =~ $stable ]]; then tag=latest; elif [[ "$version" =~ $preview ]]; then tag=next; else exit 1; fi
          [[ -z "$EXPECTED_VERSION" || "$EXPECTED_VERSION" == "$version" ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request) mode=DRY_RUN ;;
